<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EdiT</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <meta name="description" content="EdiT — навчальна платформа з інформатики для учнів 2–9 класів.">

  <!-- Шрифти з кирилицею: Unbounded (заголовки) і Nunito (текст) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=2026-11-27u">
  <!-- Сучасний вигляд: скло й тигрові смуги -->
  <link rel="stylesheet" href="css/theme.css?v=2026-11-27u">
</head>
<body>

  <!-- ===== Шапка з меню ===== -->
  <header class="topbar">
    <!-- Логотип у шапці: app.js по буквах змінює EdiT → Education → Digital → Innovation → Technology -->
    <a href="#/" class="topbar__logo" aria-label="EdiT — на головну">
      <span class="topbar__word" id="headerLogo" aria-hidden="true">EdiT</span>
    </a>

    <div class="topbar__actions">
      <!-- Кнопка «Головна»: app.js ховає її, коли ми вже на головній -->
      <a class="home-btn" id="homeBtn" href="#/" hidden>
        <img class="ico" src="img/icons/ui-home.svg" alt="" aria-hidden="true"> <span class="home-btn__text">Головна</span>
      </a>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mainMenu">
        <span aria-hidden="true">☰</span> Меню
      </button>
    </div>

    <!-- Меню з класами: наповнюється з app.js -->
    <nav class="menu" id="mainMenu" aria-label="Класи"></nav>
  </header>

  <!-- ===== Сюди app.js малює потрібну сторінку ===== -->
  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer__inner">
      <!-- Лого: смугасті літери, як у шапці -->
      <a href="#/" class="footer__brand" aria-label="EdiT — на головну">
        <span class="footer__logo" aria-hidden="true">EdiT</span>
      </a>
      <!-- Посилання на YouTube-канал автора -->
      <a class="footer__yt" href="https://www.youtube.com/@DiWasilewskii" target="_blank" rel="noopener" aria-label="YouTube-канал (відкриється в новій вкладці)">
        <img class="ico" src="img/icons/ui-youtube.svg" alt="" aria-hidden="true">
        <span>YouTube</span>
      </a>
    </div>
  </footer>

  <!-- Спочатку дані тем і уроків, потім логіка сайту.
       ?v=… — номер версії: після змін у файлах змініть його всюди,
       щоб браузери одразу завантажили нові файли, а не старі з кешу. -->
  <script src="js/topics.js?v=2026-11-27u"></script>
  <script src="js/lessons.js?v=2026-11-27u"></script>
  <script src="js/tiger-art.js?v=2026-11-27u"></script>
  <script src="js/tiger-eyes.js?v=2026-11-27u"></script>
  <script src="js/app.js?v=2026-11-27u"></script>
</body>
</html>
